[package]
name = "convert_to_jpg"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "convert-to-jpg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
image = "0.25"
cursive = { version = "0.21", default-features = false, features = ["crossterm-backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
libheif-rs = ">=0.1, <1.0"
